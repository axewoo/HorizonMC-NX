# Horizon on SCCM Retro: settings read by run.sh at every start.
# Lines are NAME=value. Delete this file to go back to the defaults.

# Your player name for single player and LAN (offline mode, no Microsoft sign-in).
PLAYER_NAME=Player

# Fullscreen at the Switch's native panel size. Set to 0 for a window.
FULLSCREEN=1

# Copy mods, resource packs and shader packs from the SD card's FAT32 side at every start,
# and turn on every mod found. Set to 0 to manage mods by hand over SFTP.
SYNC_FROM_SD=1
AUTO_ENABLE_MODS=1

# Written to options.txt on the very first start only; change them in Options afterwards.
RENDER_DISTANCE=6
SIMULATION_DISTANCE=5
