name: SCCM Retro port (aarch64 Linux)
# Builds Horizon for the Nintendo Switch running SCCM Retro (Switchroot Linux, aarch64) and packages it as an
# SCCM Retro custom port folder: horizon/{horizon-client, run.sh, sccm-port.json, horizon-sccm.conf, README}.
# No Minecraft files are built in or shipped: resources are prepared on the player's own PC.
on:
  push:
    branches: ['claude/**', 'sccm', 'sccm-*']
    tags: ['v*-sccm*']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      horizon_ref:
        description: Horizon commit to build (match the launcher's nightly whose resources you prepared)
        required: false
      native_mods:
        description: Native mods to build in (.hnmod URLs from the Horizon registry, separated by spaces)
        required: false

permissions:
  contents: write

concurrency:
  group: sccm-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Native aarch64 runner: no cross toolchain or arm64 sysroot needed. Ubuntu 22.04 keeps the glibc
    # requirement at 2.35, at or below what Switchroot's Ubuntu builds ship.
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      # Function names and lines in crash reports from the Switch.
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      # The game must match the resources the player prepared with the Horizon launcher: build the
      # launcher's nightly commit (its folder name ends in it), not this branch's newer main.
      # Nightly 2026-11-13: versions/nightly-2026-11-13-9f42064.
      HORIZON_REF: ${{ inputs.horizon_ref || '9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0' }}
      NATIVE_MODS: ${{ inputs.native_mods }}
      # horizon-mixins at least this new, the pin of the launcher at the default nightly.
      MIXINS_FLOOR: 5a64af938ec86b00d53d16a408aabc0038fb3e57
    steps:
      - uses: actions/checkout@v4
      - name: The Horizon source at that commit, with the SCCM patch
        run: |
          set -euo pipefail
          git init -q src
          git -C src fetch -q --depth 1 "https://github.com/${{ github.repository }}" "$HORIZON_REF"
          git -C src checkout -q FETCH_HEAD
          full=$(git -C src rev-parse HEAD)
          patch=packaging/sccm/patches/$full.patch
          if [ -f "$patch" ]; then git -C src apply "$PWD/$patch"; echo "applied $patch"
          else echo "::warning::no SCCM patch for $full"; fi
      - name: Rust (stable)
        run: |
          if ! command -v rustup >/dev/null; then
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      # Native mods are mixin source: the launcher applies them to the game's source with horizon-mixins and
      # compiles the result, which has no launcher or compiler on the Switch. Do the same here, into game/.
      - name: Native mods (horizon-mixins apply)
        run: |
          set -euo pipefail
          if [ -z "${NATIVE_MODS// /}" ]; then mv src game; echo "no native mods"; exit 0; fi
          work="$RUNNER_TEMP/native"; mkdir -p "$work/mods" "$work/dl"
          revs=("$MIXINS_FLOOR"); ids=()
          for url in $NATIVE_MODS; do
            case "$url" in https://github.com/*/releases/download/*.hnmod) ;; *) echo "::error::not a registry .hnmod URL: $url"; exit 1;; esac
            f="$work/dl/$(basename "$url")"; curl -fsSL -o "$f" "$url"; sha256sum "$f"
            d="$work/dl/$(basename "$url" .hnmod)"; mkdir -p "$d"; unzip -q "$f" -d "$d"
            id=$(jq -r .id "$d/horizon-native.json"); made=$(jq -r .horizon "$d/horizon-native.json")
            rev=$(jq -r '.mixins // empty' "$d/horizon-native.json"); [ -n "$rev" ] && revs+=("$rev")
            [ -d "$d/mixins/$id" ] || { echo "::error::$id has no mixins/$id: only mixin mods build here"; exit 1; }
            cp -r "$d/mixins/$id" "$work/mods/$id"; ids+=("$id $(jq -r .version "$d/horizon-native.json")")
            if [ "$made" != "$HORIZON_REF" ]; then
              # horizon-mixins applies a mod only to the revision it names. The game must match the player's
              # prepared resources, so the mod is retargeted: its injections still have to find their functions.
              echo "::warning::$id was made for Horizon $made, applying it to $HORIZON_REF"
              sed -i "s/^horizon_revision = \".*\"/horizon_revision = \"$HORIZON_REF\"/" "$work/mods/$id/horizon-mixin.toml"
            fi
          done
          git clone -q https://github.com/horizon-rust/horizon-mixins "$work/tool-src"
          # The newest of the pins, as the launcher picks it.
          rev=$(for r in "${revs[@]}"; do git -C "$work/tool-src" log -1 --format="%ct $r" "$r"; done | sort -n | tail -1 | cut -d' ' -f2)
          git -C "$work/tool-src" checkout -q "$rev"; echo "horizon-mixins $rev"
          cargo install -q --locked --path "$work/tool-src/$(cd "$work/tool-src" && dirname "$(grep -rl --include Cargo.toml '^name = "horizon-mixins-cli"' .)")" --root "$work/tool"
          find src -type l -not -path "src/.git/*" -delete
          # The revision horizon-mixins checks: src is its own git checkout at it, and the launcher's file too.
          echo "$HORIZON_REF" > src/.horizon-revision
          "$work/tool/bin/horizon-mixins" apply --workspace src --mods "$work/mods" --out game
          printf '%s\n' "${ids[@]}" > NATIVE_MODS.txt; cat NATIVE_MODS.txt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sccm-aarch64
          workspaces: game
      - name: Build the game (horizon-official, shipped as horizon-client)
        working-directory: game
        run: cargo build --release --locked -p horizon-official --bin horizon-official
      - name: Package the SCCM port folder
        run: |
          set -euo pipefail
          out=dist/horizon
          mkdir -p "$out/resources/26.3"
          cp game/target/release/horizon-official "$out/horizon-client"
          echo "$HORIZON_REF" > "$out/HORIZON_COMMIT"
          [ -f NATIVE_MODS.txt ] && cp NATIVE_MODS.txt "$out/NATIVE_MODS.txt"
          cp packaging/sccm/run.sh packaging/sccm/sccm-port.json packaging/sccm/horizon-sccm.conf "$out/"
          cp packaging/sccm/README-SCCM.md "$out/"
          cp -r packaging/sccm/defaults "$out/"
          lic=src; [ -d src ] || lic=game; cp "$lic/LICENSE" "$lic/THIRD_PARTY_NOTICES.md" "$out/"
          chmod +x "$out/run.sh" "$out/horizon-client"
          file "$out/horizon-client"
          echo "glibc symbols needed:"; objdump -T "$out/horizon-client" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3
          "$out/horizon-client" --help | head -3
          tar -C dist -czf dist/horizon-sccm-aarch64.tar.gz horizon
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-sccm-aarch64
          path: dist/horizon-sccm-aarch64.tar.gz
          if-no-files-found: error
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/horizon-sccm-aarch64.tar.gz
          prerelease: true
